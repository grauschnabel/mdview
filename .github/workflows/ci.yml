name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev fakeroot
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Build .deb
        run: packaging/build-deb.sh
